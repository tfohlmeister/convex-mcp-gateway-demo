name: Test and build
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  # Weekly run catches breakage from new convex-mcp-gateway releases
  # even if Dependabot doesn't open a PR (e.g. when the latest semver
  # range already covers the new version).
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install
        # Use --no-frozen-lockfile so the scheduled run picks up newer
        # convex-mcp-gateway versions within the declared semver range
        # (the whole point of the cron job). For push/PR this is fine
        # too: the lockfile is committed and only updates if the
        # registry actually has a newer compatible version.
        run: pnpm install --no-frozen-lockfile

      # No codegen step: `convex/_generated/` is committed so we don't
      # need a Convex deployment in CI. When schemas or function shapes
      # change, regenerate locally with `pnpm convex codegen` (after
      # `pnpm local:start`) and commit the diff.

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Drives the mounted /mcp/ route against an in-memory deployment,
      # so a convex-mcp-gateway release that changes the wire format or
      # the authorization contract fails here rather than in a demo.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # `src/main.tsx` throws at module load when this is unset, and
          # the bundler then drops the entire app as dead code behind
          # that throw. The build still exits 0, so without a value here
          # this step proves nothing about the app. Any syntactically
          # valid URL does: nothing connects at build time.
          VITE_CONVEX_URL: http://127.0.0.1:3310

      - name: Assert the app actually got bundled
        run: |
          grep -q "convex-mcp-gateway playground" dist/assets/*.js \
            || { echo "::error::app code missing from bundle"; exit 1; }
